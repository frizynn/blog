baseURL = 'https://juanlebrero.com/'
languageCode = 'en-us'
title = 'Juan Lebrero'
theme = 'hugo-PaperMod'

# Multilingual configuration
[languages]
[languages.en]
languageName = "English"
weight = 1
contentDir = "content/en"

[languages.es]
languageName = "Español"
weight = 2
contentDir = "content/es"

# Default language parameters
[params]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
mainSections = ["post", "posts"]

# Enable KaTeX via partial when page param `.Params.math` is true
# Set `params.math = true` to enable globally (optional)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# Social icons
[[params.socialIcons]]
name = "twitter"
url = "https://x.com/lebrious"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/lebrero-juan-francisco/"

# Menu configuration
[menu]
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

# English menu
[languages.en.menu]
[[languages.en.menu.main]]
name = "Home"
url = "/"
weight = 1

[[languages.en.menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

# Spanish menu
[languages.es.menu]
[[languages.es.menu.main]]
name = "Inicio"
url = "/es/"
weight = 1

[[languages.es.menu.main]]
name = "Posts"
url = "/es/posts/"
weight = 2

# Home hero content (per language)
[languages.en.params]
[languages.en.params.homeInfoParams]
Title = "Juan Lebrero"
Content = "AI/ML engineer. I write about LLMs, large‑scale training, and practical ML."

[languages.es.params]
[languages.es.params.homeInfoParams]
Title = "Juan Lebrero"
Content = "Ingeniero de IA/ML. Escribo sobre LLMs, entrenamiento a escala y ML práctico."
