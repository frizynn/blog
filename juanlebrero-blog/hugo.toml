# Home hero content (per language)
[languages.en.params]
[languages.en.params.homeInfoParams]
Title = "Juan Francisco Lebrero"
Content = "AI/ML Engineer & Research Assistant at LiNAR, UdeSA. Building autonomous vehicles with semantic SLAM, developing RAG+DSL agents for 911 systems, and deploying multimodal OCR solutions. ICPC Latin American qualifier, passionate about LLMs, computer vision, and large-scale ML systems."

[languages.es.params]
[languages.es.params.homeInfoParams]
Title = "Juan Francisco Lebrero"
Content = "Ingeniero de IA/ML y Asistente de Investigación en LiNAR, UdeSA. Construyendo vehículos autónomos con SLAM semántico, desarrollando agentes RAG+DSL para sistemas 911, y desplegando soluciones OCR multimodales. Calificado para ICPC Latinoamérica, apasionado por LLMs, visión por computadora y sistemas ML a gran escala."
