baseURL = 'https://juanlebrero.com/'
languageCode = 'en-us'
title = 'Juan Lebrero'
theme = 'hugo-theme-nostyleplease'

# Multilingual configuration
[languages]
[languages.en]
languageName = "English"
weight = 1
contentDir = "content/en"

[languages.es]
languageName = "Español"
weight = 2
contentDir = "content/es"

# Default language parameters
[params]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
mainSections = ["post", "posts"]

# Theme configuration
[params.theme_config]
appearance = "auto"
back_home_text = ".."
date_format = "2006-01-02"
isListGroupByDate = false
isShowFooter = true

# Enable KaTeX via partial when page param `.Params.math` is true
# Set `params.math = true` to enable globally (optional)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# Social icons
[[params.socialIcons]]
name = "github"
url = "https://github.com/frizynn"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/lebrero-juan-francisco/"

[[params.socialIcons]]
name = "mail"
url = "mailto:lebrerojuanfrancisco@gmail.com"

