<!-- Theme Toggle Button -->
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
  <span class="theme-icon">🌙</span>
</button>

<script>
  (function () {
    'use strict';

    // Theme state management
    const THEME_KEY = 'theme-preference';
    const THEMES = {
      LIGHT: 'light',
      DARK: 'dark'
    };

    // Theme icons
    const ICONS = {
      [THEMES.LIGHT]: '☀️',
      [THEMES.DARK]: '🌙'
    };

    // Get current theme from localStorage or default to light
    function getCurrentTheme() {
      return localStorage.getItem(THEME_KEY) || THEMES.LIGHT;
    }

    // Save theme preference
    function saveTheme(theme) {
      localStorage.setItem(THEME_KEY, theme);
    }

    // Apply theme to body
    function applyTheme(theme) {
      document.body.setAttribute('a', theme);
    }

    // Update button icon
    function updateButtonIcon(theme) {
      const button = document.getElementById('theme-toggle');
      const icon = button.querySelector('.theme-icon');
      if (icon) {
        icon.textContent = ICONS[theme];
      }
    }

    // Cycle through themes
    function cycleTheme() {
      const current = getCurrentTheme();
      let next = current === THEMES.LIGHT ? THEMES.DARK : THEMES.LIGHT;

      saveTheme(next);
      applyTheme(next);
      updateButtonIcon(next);
    }

    // Initialize theme on page load
    function initTheme() {
      const theme = getCurrentTheme();
      applyTheme(theme);
      // Wait for DOM to update button
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => updateButtonIcon(theme));
      } else {
        updateButtonIcon(theme);
      }
    }

    // Add click event listener
    function addToggleListener() {
      const button = document.getElementById('theme-toggle');
      if (button) {
        button.addEventListener('click', cycleTheme);
      }
    }

    // Initialize
    initTheme();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addToggleListener);
    } else {
      addToggleListener();
    }
  })();
</script>
